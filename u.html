<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARIA</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; background: #050510; color: #e2e8f0; }

  /* Spline background — fills entire screen */
  #spline-bg { position: fixed; inset: 0; z-index: 0; }
  #spline-bg iframe { width: 100%; height: 100%; border: none; }

  /* Semi-transparent overlay — lets Spline bleed through */
  #app-overlay {
    position: fixed; inset: 0; z-index: 1;
    background: rgba(5, 5, 16, 0.75);
    backdrop-filter: blur(2px);
    display: flex; flex-direction: column;
  }

  /* Top bar */
  #top-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  /* Chat panel — takes most of the screen */
  #chat-panel {
    flex: 1; overflow-y: auto; padding: 16px 20px;
    display: flex; flex-direction: column; gap: 12px;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent;
  }
  #chat-panel::-webkit-scrollbar { width: 6px; }
  #chat-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

  /* Message bubbles */
  .msg { animation: fadeIn 0.3s ease; max-width: 85%; }
  .msg.user { align-self: flex-end; }
  .msg.aria { align-self: flex-start; }
  .msg-inner {
    padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6;
    user-select: text; cursor: text; word-wrap: break-word;
  }
  .msg.user .msg-inner { background: rgba(99,102,241,0.2); border: 1px solid rgba(99,102,241,0.3); color: #c7d2fe; }
  .msg.aria .msg-inner { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); color: #e2e8f0; }
  .msg-role { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; opacity: 0.5; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
  .cursor-blink::after { content: '▊'; animation: pulse 0.8s infinite; color: #818cf8; }

  /* Input bar */
  #input-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 20px; flex-shrink: 0;
    border-top: 1px solid rgba(255,255,255,0.06);
    background: rgba(0,0,0,0.3);
  }
  #chat-input {
    flex: 1; font-family: inherit; font-size: 14px; color: #e2e8f0;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; padding: 10px 14px; outline: none;
    transition: border-color 0.2s;
  }
  #chat-input:focus { border-color: rgba(129,140,248,0.5); }
  #chat-input::placeholder { color: #64748b; }
  .input-btn { background: none; border: none; cursor: pointer; font-size: 20px; opacity: 0.4; transition: opacity 0.2s; padding: 6px; }
  .input-btn:hover { opacity: 1; }

  /* Webcam preview */
  #webcam-preview {
    position: fixed; top: 16px; right: 16px; z-index: 200;
    width: 180px; min-width: 100px; max-width: 80vw;
    border-radius: 10px; overflow: hidden;
    border: 2px solid rgba(129,140,248,0.4);
    background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    cursor: grab; user-select: none;
    transition: opacity 0.4s, border-color 0.3s;
  }
  #webcam-preview:active { cursor: grabbing; }
  #webcam-preview.no-feed { opacity: 0.3; border-color: rgba(248,113,113,0.5); }
  #webcam-preview video { width: 100%; display: block; transform: scaleX(-1); }
  #webcam-preview canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; transform: scaleX(-1); }
  #wc-resize {
    position: absolute; bottom: 0; right: 0; width: 18px; height: 18px;
    cursor: nwse-resize; z-index: 210;
    background: linear-gradient(135deg, transparent 50%, rgba(129,140,248,0.5) 50%);
    border-radius: 0 0 8px 0;
  }
  #wc-resize:hover { background: linear-gradient(135deg, transparent 40%, rgba(129,140,248,0.8) 40%); }
  #webcam-status {
    position: absolute; bottom: 0; left: 0; right: 0;
    font-family: monospace; font-size: 10px; text-align: center;
    padding: 2px 0; color: #4ade80; background: rgba(0,0,0,0.6);
  }
  #webcam-status.off { color: #f87171; }

  /* Mic panel */
  #mic-panel { position: fixed; bottom: 80px; right: 20px; z-index: 100; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: none; }
</style>
</head>

<body>

  <!-- Spline 3D background — fullscreen, static -->
  <div id="spline-bg">
    <iframe src="https://my.spline.design/thresholddarkambientui-v0gkZCfi6zXm69kE0wccy70f" id="aura-spline"></iframe>
  </div>

  <!-- App overlay — semi-transparent so Spline bleeds through -->
  <div id="app-overlay">

    <!-- Top bar: status + controls -->
    <div id="top-bar">
      <div style="display:flex;align-items:center;gap:10px;">
        <span id="dot" style="width:8px;height:8px;border-radius:50%;background:#f87171;display:inline-block;box-shadow:0 0 6px #f87171;transition:background 0.3s;"></span>
        <span id="conn-text" style="font-size:12px;color:#f87171;letter-spacing:0.5px;text-transform:uppercase;transition:color 0.3s;">offline</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <span id="mute-label" style="font-size:11px;color:#64748b;opacity:0;transition:opacity 0.3s;">⏸ PAUSED</span>
        <button id="history-btn" class="input-btn" title="View conversation history" style="font-size:16px;">📋</button>
      </div>
    </div>

    <!-- Chat panel -->
    <div id="chat-panel"></div>

    <!-- Input bar -->
    <div id="input-bar">
      <label id="attach-btn" class="input-btn" title="Attach file or image" style="font-size:18px;">📎
        <input type="file" id="file-input" accept="image/*,.txt,.md,.pdf,.json,.csv" multiple style="display:none;">
      </label>
      <input type="text" id="chat-input" placeholder="Type a message or paste a link…">
      <button id="send-btn" class="input-btn" title="Send">➤</button>
    </div>
  </div>

  <!-- Mic level + live transcription — bottom right -->
  <div id="mic-panel">
    <div id="mic-transcript" style="font-size:12px;color:#94a3b8;background:rgba(0,0,0,0.5);padding:4px 12px;border-radius:8px;backdrop-filter:blur(8px);max-width:300px;text-align:right;opacity:0;transition:opacity 0.3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span id="mic-icon" style="font-size:16px;opacity:0.5;transition:opacity 0.2s;">🎙</span>
      <div style="width:120px;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden;">
        <div id="mic-bar" style="height:100%;width:0%;background:linear-gradient(90deg,#4ade80,#facc15,#f87171);border-radius:3px;transition:width 0.05s ease-out;"></div>
      </div>
      <span id="mic-status-label" style="font-size:10px;color:#64748b;min-width:50px;">silent</span>
    </div>
  </div>

  <!-- Webcam preview — draggable + resizable -->
  <div id="webcam-preview" class="no-feed">
    <video id="webcam-video" autoplay playsinline muted></video>
    <canvas id="webcam-canvas"></canvas>
    <div id="webcam-status" class="off">no feed</div>
    <div id="wc-resize"></div>
  </div>

  <script>
  const WS_URL = 'ws://localhost:8000/ws';
  let ws = null;
  let muted = false;
  let reconnectTimer = null;
  let isSpeaking = false;

  const chatPanel = document.getElementById('chat-panel');
  const muteLabelEl = document.getElementById('mute-label');
  const dot = document.getElementById('dot');
  const connText = document.getElementById('conn-text');
  let streamEl = null;

  // ── Mic bar elements ──────────────────────────────────────────
  const micBar = document.getElementById('mic-bar');
  const micIcon = document.getElementById('mic-icon');
  const micStatusLabel = document.getElementById('mic-status-label');

  function connect() {
    ws = new WebSocket(WS_URL);
    ws.onopen = () => {
      dot.style.background = '#4ade80';
      dot.style.boxShadow = '0 0 8px #4ade80';
      connText.textContent = 'ARIA online';
      connText.style.color = '#4ade80';
      clearTimeout(reconnectTimer);
    };
    ws.onclose = () => {
      dot.style.background = '#f87171';
      dot.style.boxShadow = '0 0 6px #f87171';
      connText.textContent = 'offline';
      connText.style.color = '#f87171';
      streamEl = null;
      reconnectTimer = setTimeout(connect, 2000);
    };
    ws.onerror = () => ws.close();
    ws.onmessage = (e) => {
      try { dispatch(JSON.parse(e.data)); } catch {}
    };
  }

  function setStatus(text, color) {
    connText.textContent = text;
    connText.style.color = color;
    dot.style.background = color;
    dot.style.boxShadow = `0 0 8px ${color}`;
  }

  function dispatch(msg) {
    switch (msg.kind) {
      case 'thinking':
        streamEl = addMsg('aria', '');
        streamEl.querySelector('.text').classList.add('cursor-blink');
        setStatus('ARIA thinking…', '#facc15');
        break;
      case 'token': {
        const t = msg.payload?.text || '';
        if (!streamEl) { streamEl = addMsg('aria', ''); }
        const span = streamEl.querySelector('.text');
        span.classList.add('cursor-blink');
        span.textContent += t;
        scrollChat();
        break;
      }
      case 'response': {
        if (streamEl) {
          const span = streamEl.querySelector('.text');
          span.textContent = msg.payload?.text || '';
          span.classList.remove('cursor-blink');
          streamEl = null;
        } else if (msg.payload?.text) {
          addMsg('aria', msg.payload.text);
        }
        setStatus('ARIA online', '#4ade80');
        break;
      }
      case 'mic':
        if (msg.payload?.text) {
          addMsg('user', msg.payload.text);
          const micTranscript = document.getElementById('mic-transcript');
          micTranscript.textContent = '🎙 ' + msg.payload.text;
          micTranscript.style.opacity = '1';
          micTranscript.style.color = '#4ade80';
          clearTimeout(window._micFadeTimer);
          window._micFadeTimer = setTimeout(() => { micTranscript.style.opacity = '0'; }, 4000);
        }
        break;
      case 'tts':
        isSpeaking = !!msg.payload?.speaking;
        setStatus(isSpeaking ? 'ARIA speaking' : 'ARIA online', isSpeaking ? '#38bdf8' : '#4ade80');
        break;
      case 'mic_level': {
        const vol = msg.payload?.volume || 0;
        const speech = msg.payload?.speech || false;
        const pct = Math.min(100, vol * 250);
        micBar.style.width = pct + '%';
        micIcon.style.opacity = speech ? '1' : '0.4';
        micStatusLabel.textContent = vol > 0.15 ? 'speaking' : speech ? 'hearing' : 'silent';
        micStatusLabel.style.color = vol > 0.15 ? '#4ade80' : speech ? '#facc15' : '#64748b';
        break;
      }
      case 'status':
        if (msg.payload?.paused !== undefined) {
          muted = msg.payload.paused;
          showMuteState();
          setStatus(muted ? 'ARIA paused' : 'ARIA online', muted ? '#facc15' : '#4ade80');
        }
        break;
    }
  }

  function addMsg(role, text) {
    const div = document.createElement('div');
    div.className = `msg ${role === 'aria' ? 'aria' : 'user'}`;
    const roleLabel = role === 'aria' ? 'ARIA' : 'You';
    div.innerHTML = `<div class="msg-role">${roleLabel}</div><div class="msg-inner"><span class="text">${text}</span></div>`;
    chatPanel.appendChild(div);
    while (chatPanel.children.length > 50) chatPanel.removeChild(chatPanel.firstChild);
    scrollChat();
    return div;
  }

  function scrollChat() {
    chatPanel.scrollTop = chatPanel.scrollHeight;
  }

  function toggleMute() {
    if (!ws || ws.readyState !== 1) return;
    muted = !muted;
    ws.send(JSON.stringify({ kind: muted ? 'pause' : 'resume', ts: Date.now() }));
    showMuteState();
  }

  function showMuteState() {
    muteLabelEl.textContent = muted ? '⏸ PAUSED' : '▶ LISTENING';
    muteLabelEl.style.opacity = '1';
    muteLabelEl.style.color = muted ? '#facc15' : '#4ade80';
    setTimeout(() => { muteLabelEl.style.opacity = '0'; }, 2500);
  }

  // ── Live webcam + MediaPipe face detection ──────────────────────
  const wcPreview = document.getElementById('webcam-preview');
  const wcVideo = document.getElementById('webcam-video');
  const wcCanvas = document.getElementById('webcam-canvas');
  const wcCtx = wcCanvas.getContext('2d');
  const wcStatus = document.getElementById('webcam-status');
  let wcHasFeed = false;
  let faceLandmarker = null;
  let lastFaceTime = 0;

  // Load MediaPipe Tasks Vision (pre-loaded as module in <head>)
  async function loadMediaPipe() {
    try {
      // Wait for module pre-load (up to 10s)
      for (let i = 0; i < 100 && window._mpVision === undefined; i++) {
        await new Promise(r => setTimeout(r, 100));
      }
      if (!window._mpVision) throw new Error('Module did not load');
      const { FaceLandmarker, FilesetResolver, DrawingUtils } = window._mpVision;
      const filesetResolver = await FilesetResolver.forVisionTasks(
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm'
      );
      faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
          delegate: 'GPU'
        },
        runningMode: 'VIDEO',
        numFaces: 1,
        outputFaceBlendshapes: true,
        outputFacialTransformationMatrixes: false
      });
      window._mpDrawingUtils = DrawingUtils;
      window._mpFaceLandmarker = FaceLandmarker;
      console.log('[MediaPipe] FaceLandmarker ready');
    } catch (e) {
      console.warn('[MediaPipe] Failed to load — face detection disabled:', e);
    }
  }
  loadMediaPipe();

  // Start live webcam stream
  async function startWebcam() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' },
        audio: false
      });
      wcVideo.srcObject = stream;
      wcVideo.addEventListener('loadeddata', () => {
        wcHasFeed = true;
        wcPreview.classList.remove('no-feed');
        wcStatus.textContent = '● live';
        wcStatus.className = '';
        wcStatus.id = 'webcam-status';
        wcCanvas.width = wcVideo.videoWidth;
        wcCanvas.height = wcVideo.videoHeight;
        detectLoop();
      });
    } catch (e) {
      console.warn('[Webcam] Access denied or unavailable:', e);
      wcStatus.textContent = 'no feed';
      wcStatus.className = 'off';
      wcStatus.id = 'webcam-status';
    }
  }
  startWebcam();

  // Hidden canvas for capturing low-res frames to send to Qwen3-VL
  const frameCanvas = document.createElement('canvas');
  frameCanvas.width = 160; frameCanvas.height = 120;
  const frameCtx = frameCanvas.getContext('2d');
  let lastFrameSend = 0;
  const FRAME_INTERVAL_MS = 5000; // send a frame every 5s (vision is expensive)

  function captureFrame() {
    if (!wcHasFeed || !wcVideo.videoWidth) return null;
    frameCtx.drawImage(wcVideo, 0, 0, 160, 120);
    // Return base64 JPEG without the data:image/jpeg;base64, prefix
    const dataUrl = frameCanvas.toDataURL('image/jpeg', 0.4);
    return dataUrl.split(',')[1]; // strip prefix, return raw base64
  }

  // Face detection loop — runs on every animation frame
  let lastDetectMs = 0;
  function detectLoop() {
    if (!wcHasFeed) return;
    const now = performance.now();
    // Clear canvas
    wcCtx.clearRect(0, 0, wcCanvas.width, wcCanvas.height);

    if (faceLandmarker && now - lastDetectMs > 66) { // ~15fps detection
      lastDetectMs = now;
      try {
        const results = faceLandmarker.detectForVideo(wcVideo, now);
        if (results.faceLandmarks && results.faceLandmarks.length > 0) {
          // Draw face mesh
          const landmarks = results.faceLandmarks[0];
          drawFaceMesh(landmarks);

          // Update status
          lastFaceTime = Date.now();

          // Send blendshapes to server if available
          if (results.faceBlendshapes && results.faceBlendshapes.length > 0 && ws && ws.readyState === 1) {
            const shapes = results.faceBlendshapes[0].categories;
            // Extract key expressions
            const expr = {};
            for (const s of shapes) {
              if (['browInnerUp', 'eyeSquintLeft', 'eyeSquintRight', 'jawOpen',
                   'mouthSmileLeft', 'mouthSmileRight', 'mouthFrownLeft', 'mouthFrownRight',
                   'eyeBlinkLeft', 'eyeBlinkRight'].includes(s.categoryName)) {
                expr[s.categoryName] = Math.round(s.score * 100) / 100;
              }
            }
            // Derive mood for status display
            const smile = ((expr.mouthSmileLeft||0) + (expr.mouthSmileRight||0)) / 2;
            const frown = ((expr.mouthFrownLeft||0) + (expr.mouthFrownRight||0)) / 2;
            const brow = expr.browInnerUp || 0;
            const jaw = expr.jawOpen || 0;
            const blink = ((expr.eyeBlinkLeft||0) + (expr.eyeBlinkRight||0)) / 2;
            let mood = 'neutral';
            if (smile > 0.4) mood = 'smile ' + Math.round(smile*100) + '%';
            else if (frown > 0.3) mood = 'frown';
            else if (brow > 0.4) mood = 'surprised';
            else if (jaw > 0.5) mood = 'talking';
            else if (blink > 0.5) mood = 'blink';
            wcStatus.textContent = '● face · ' + mood;

            // Throttle expressions: send at most every 500ms
            if (now - (window._lastExprSend || 0) > 500) {
              window._lastExprSend = now;
              // Capture a frame every FRAME_INTERVAL_MS for native vision
              let frame = null;
              if (now - lastFrameSend > FRAME_INTERVAL_MS) {
                frame = captureFrame();
                if (frame) lastFrameSend = now;
              }
              ws.send(JSON.stringify({ kind: 'vision', payload: { face: true, expressions: expr, frame } }));
            }
          } else {
            wcStatus.textContent = '● face detected';
          }
        } else {
          // No face
          if (Date.now() - lastFaceTime > 3000 && wcHasFeed) {
            wcStatus.textContent = '● live (no face)';
          }
        }
      } catch (e) { /* detection error, skip frame */ }
    }
    requestAnimationFrame(detectLoop);
  }

  // Draw minimal face mesh overlay
  function drawFaceMesh(landmarks) {
    wcCtx.save();
    // Draw dots at key landmark positions
    wcCtx.fillStyle = 'rgba(250, 204, 21, 0.4)';
    // Face oval indices (simplified)
    const keyPoints = [10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288,
                       397, 365, 379, 378, 400, 377, 152, 148, 176, 149, 150, 136,
                       172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109];
    for (const idx of keyPoints) {
      if (landmarks[idx]) {
        const x = landmarks[idx].x * wcCanvas.width;
        const y = landmarks[idx].y * wcCanvas.height;
        wcCtx.beginPath();
        wcCtx.arc(x, y, 1.5, 0, 2 * Math.PI);
        wcCtx.fill();
      }
    }
    // Eye outlines
    wcCtx.strokeStyle = 'rgba(74, 222, 128, 0.5)';
    wcCtx.lineWidth = 1;
    const leftEye = [33, 7, 163, 144, 145, 153, 154, 155, 133, 173, 157, 158, 159, 160, 161, 246];
    const rightEye = [362, 382, 381, 380, 374, 373, 390, 249, 263, 466, 388, 387, 386, 385, 384, 398];
    for (const eye of [leftEye, rightEye]) {
      wcCtx.beginPath();
      for (let i = 0; i < eye.length; i++) {
        const pt = landmarks[eye[i]];
        if (!pt) continue;
        const x = pt.x * wcCanvas.width, y = pt.y * wcCanvas.height;
        i === 0 ? wcCtx.moveTo(x, y) : wcCtx.lineTo(x, y);
      }
      wcCtx.closePath();
      wcCtx.stroke();
    }
    wcCtx.restore();
  }

  // Drag logic (move from body, resize from handle)
  let dragging = false, resizing = false, dragOffX = 0, dragOffY = 0, resizeStartW = 0, resizeStartX = 0;
  const wcResize = document.getElementById('wc-resize');

  // Resize handle
  wcResize.addEventListener('mousedown', (e) => {
    resizing = true;
    resizeStartW = wcPreview.getBoundingClientRect().width;
    resizeStartX = e.clientX;
    e.preventDefault(); e.stopPropagation();
  });

  // Move handle (anywhere except resize corner)
  wcPreview.addEventListener('mousedown', (e) => {
    if (resizing) return;
    dragging = true;
    dragOffX = e.clientX - wcPreview.getBoundingClientRect().left;
    dragOffY = e.clientY - wcPreview.getBoundingClientRect().top;
    e.preventDefault(); e.stopPropagation();
  });

  document.addEventListener('mousemove', (e) => {
    if (resizing) {
      const newW = Math.max(100, Math.min(window.innerWidth * 0.8, resizeStartW + (e.clientX - resizeStartX)));
      wcPreview.style.width = newW + 'px';
    } else if (dragging) {
      wcPreview.style.left = (e.clientX - dragOffX) + 'px';
      wcPreview.style.top = (e.clientY - dragOffY) + 'px';
      wcPreview.style.right = 'auto';
    }
  });
  document.addEventListener('mouseup', () => { dragging = false; resizing = false; });
  // Prevent drag/resize from triggering mute toggle
  wcPreview.addEventListener('click', (e) => { e.stopPropagation(); });

  // Spacebar toggles pause/resume (only when not typing in input)
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !e.repeat && document.activeElement !== chatInput) {
      e.preventDefault();
      toggleMute();
    }
  });

  // ── Chat input: send text ──
  const chatInput = document.getElementById('chat-input');
  const sendBtn = document.getElementById('send-btn');
  const attachBtn = document.getElementById('attach-btn');
  const fileInput = document.getElementById('file-input');

  function sendText() {
    const text = chatInput.value.trim();
    if (!text || !ws || ws.readyState !== 1) return;
    ws.send(JSON.stringify({ kind: 'command', payload: { text, speaker: 'Neokode' } }));
    addMsg('user', text);
    chatInput.value = '';
  }

  sendBtn.addEventListener('click', (e) => { e.stopPropagation(); sendText(); });
  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
  });

  // Hover effects
  sendBtn.addEventListener('mouseenter', () => sendBtn.style.opacity = '1');
  sendBtn.addEventListener('mouseleave', () => sendBtn.style.opacity = '0.5');
  attachBtn.addEventListener('mouseenter', () => attachBtn.style.opacity = '1');
  attachBtn.addEventListener('mouseleave', () => attachBtn.style.opacity = '0.5');

  // ── File/image upload ──
  fileInput.addEventListener('change', async (e) => {
    const files = e.target.files;
    if (!files.length) return;
    for (const file of files) {
      if (file.type.startsWith('image/')) {
        // Upload image to server
        const form = new FormData();
        form.append('file', file);
        try {
          const resp = await fetch('/knowledge/upload', { method: 'POST', body: form });
          const data = await resp.json();
          if (data.ok) {
            addMsg('user', `📎 Uploaded image: ${file.name}`);
            ws.send(JSON.stringify({ kind: 'command', payload: { text: `I just uploaded an image called "${file.name}". Acknowledge it.`, speaker: 'Neokode' } }));
          }
        } catch (err) { addMsg('user', `❌ Upload failed: ${err.message}`); }
      } else {
        // Text-based files — read and send as message
        const text = await file.text();
        const preview = text.slice(0, 2000);
        ws.send(JSON.stringify({ kind: 'command', payload: { text: `Here is the content of ${file.name}:\n\n${preview}`, speaker: 'Neokode' } }));
        addMsg('user', `📎 Sent file: ${file.name} (${text.length} chars)`);
      }
    }
    fileInput.value = '';  // reset
  });

  // ── Conversation history panel ──
  document.getElementById('history-btn').addEventListener('click', async () => {
    // Toggle existing panel
    let panel = document.getElementById('history-panel');
    if (panel) { panel.remove(); return; }

    panel = document.createElement('div');
    panel.id = 'history-panel';
    panel.style.cssText = 'position:fixed;top:50px;right:20px;bottom:80px;width:360px;z-index:300;background:rgba(10,10,30,0.95);border:1px solid rgba(255,255,255,0.1);border-radius:12px;backdrop-filter:blur(12px);overflow-y:auto;padding:16px;font-size:13px;color:#e2e8f0;';
    panel.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><b>Conversation History</b><button onclick="this.parentElement.parentElement.remove()" style="background:none;border:none;color:#94a3b8;cursor:pointer;font-size:16px;">✕</button></div><div id="history-list">Loading...</div>';
    document.body.appendChild(panel);

    try {
      const resp = await fetch('/conversations');
      const data = await resp.json();
      const list = document.getElementById('history-list');
      if (!data.conversations?.length) { list.textContent = 'No conversations yet.'; return; }
      list.innerHTML = data.conversations.map(c => `
        <div style="padding:8px;margin:4px 0;background:rgba(255,255,255,0.04);border-radius:8px;cursor:pointer;border:1px solid rgba(255,255,255,0.06);" onclick="viewConvo('${c.id}')">
          <div style="font-size:11px;color:#64748b;">${new Date(c.updated_at).toLocaleString()} · ${c.turn_count} turns</div>
          <div style="margin-top:4px;color:#cbd5e1;">${c.summary || 'Conversation'}</div>
        </div>
      `).join('');
    } catch (e) { document.getElementById('history-list').textContent = 'Error loading: ' + e.message; }
  });

  window.viewConvo = async function(id) {
    const list = document.getElementById('history-list');
    list.innerHTML = 'Loading conversation...';
    try {
      const resp = await fetch(`/conversations/${id}`);
      const data = await resp.json();
      let html = '<button onclick="document.getElementById(\'history-btn\').click();document.getElementById(\'history-btn\').click();" style="background:none;border:none;color:#818cf8;cursor:pointer;margin-bottom:8px;">← Back</button>';
      html += '<button onclick="navigator.clipboard.writeText(this.parentElement.querySelector(\'.conv-export\').innerText).then(()=>this.textContent=\'✓ Copied\')" style="float:right;background:rgba(99,102,241,0.2);border:1px solid rgba(99,102,241,0.3);color:#c7d2fe;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:11px;">Copy All</button>';
      html += '<div class="conv-export">';
      data.turns.forEach(t => {
        const who = t.role === 'user' ? 'NeoKode' : 'ARIA';
        const time = t.timestamp ? new Date(t.timestamp).toLocaleTimeString() : '';
        html += `<div style="margin:8px 0;padding:8px;background:rgba(255,255,255,${t.role==='user'?'0.03':'0.06'});border-radius:6px;user-select:text;"><span style="font-size:10px;color:#64748b;">${who} ${time}</span><div style="margin-top:4px;">${t.content}</div></div>`;
      });
      html += '</div>';
      list.innerHTML = html;
    } catch (e) { list.textContent = 'Error: ' + e.message; }
  };

  connect();
  </script>

</body>
</html>
