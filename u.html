<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARIA</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: 0.03;
    pointer-events: none;
    z-index: 9999;
    mix-blend-mode: overlay;
  }
  #chat-log { scrollbar-width: none; }
  #chat-log::-webkit-scrollbar { display: none; }
  .msg { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
  #mute-indicator { transition: opacity 0.3s; }
  .cursor-blink::after { content: '▊'; animation: pulse 0.8s infinite; color: #facc15; }
  /* Webcam preview */
  #webcam-preview {
    position: fixed; top: 16px; right: 16px; z-index: 200;
    width: 180px; border-radius: 10px; overflow: hidden;
    border: 2px solid rgba(250,204,21,0.4);
    background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    cursor: grab; user-select: none;
    transition: opacity 0.4s, border-color 0.3s;
  }
  #webcam-preview:active { cursor: grabbing; }
  #webcam-preview.no-feed { opacity: 0.3; border-color: rgba(248,113,113,0.5); }
  #webcam-preview img { width: 100%; display: block; }
  #webcam-status {
    position: absolute; bottom: 0; left: 0; right: 0;
    font-family: monospace; font-size: 10px; text-align: center;
    padding: 2px 0; color: #4ade80; background: rgba(0,0,0,0.6);
  }
  #webcam-status.off { color: #f87171; }
  #anim-container {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    transition: filter 0.08s ease-out, transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    will-change: transform, filter;
  }
  #voice-glow {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, rgba(250,204,21,0.0) 0%, transparent 70%);
    transition: opacity 0.15s ease-out, background 0.8s ease;
    opacity: 0;
  }
</style>
</head>

<body class="m-0 w-screen h-screen overflow-hidden bg-[#050510] cursor-pointer select-none" onclick="toggleMute()">

  <!-- Fullscreen Animation Container -->
  <div id="anim-container">
    <div data-us-project="lmSXlfVhWVrbN3qzElFu" data-us-scale="1" data-us-dpi="1.5" data-us-fps="60" data-us-lazyload="true" data-us-production="true" role="img" aria-label="Animated 3D background" style="width:100%;height:100%;"></div>
  </div>

  <!-- Voice-reactive glow overlay -->
  <div id="voice-glow"></div>

  <!-- Mute indicator — top center -->
  <div id="mute-indicator" style="position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:100;opacity:0;pointer-events:none;">
    <span id="mute-label" style="font-family:monospace;font-size:14px;color:#facc15;background:rgba(0,0,0,0.5);padding:4px 14px;border-radius:20px;backdrop-filter:blur(8px);"></span>
  </div>

  <!-- Chat overlay — bottom left -->
  <div id="chat-log" style="position:fixed;bottom:24px;left:24px;right:24px;max-height:40vh;overflow-y:auto;z-index:100;display:flex;flex-direction:column;gap:6px;pointer-events:none;"></div>

  <!-- Connection dot — top left -->
  <div id="conn-dot" style="position:fixed;top:16px;left:16px;z-index:100;display:flex;align-items:center;gap:6px;pointer-events:none;">
    <span id="dot" style="width:8px;height:8px;border-radius:50%;background:#f87171;display:inline-block;"></span>
    <span id="conn-text" style="font-family:monospace;font-size:11px;color:#475569;"></span>
  </div>

  <!-- Webcam preview — draggable, top right -->
  <div id="webcam-preview" class="no-feed">
    <img id="webcam-img" src="" alt="webcam feed">
    <div id="webcam-status" class="off">no feed</div>
  </div>

  <!-- Unicorn Studio SDK -->
  <script>
  !function(){var u=window.UnicornStudio;if(u&&u.init){u.init()}else{var d=document,s=d.createElement("script");s.src="https://cdn.jsdelivr.net/gh/hiunicornstudio/unicornstudio.js@v2.1.3/dist/unicornStudio.umd.js";s.onload=function(){window.UnicornStudio&&window.UnicornStudio.init()};(d.head||d.body).appendChild(s)}}();
  </script>

  <script>
  const WS_URL = 'ws://localhost:8000/ws';
  let ws = null;
  let muted = false;
  let reconnectTimer = null;
  let isSpeaking = false;

  const chatLog = document.getElementById('chat-log');
  const muteIndicator = document.getElementById('mute-indicator');
  const muteLabel = document.getElementById('mute-label');
  const dot = document.getElementById('dot');
  const connText = document.getElementById('conn-text');
  const animContainer = document.getElementById('anim-container');
  const voiceGlow = document.getElementById('voice-glow');
  let streamEl = null;

  // ── Audio reactivity via browser mic ──────────────────────────
  let audioCtx = null, analyser = null, dataArray = null;
  let audioInitialized = false;

  async function initAudio() {
    if (audioInitialized) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      audioCtx = new AudioContext();
      const source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.8;
      source.connect(analyser);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      audioInitialized = true;
      audioLoop();
    } catch (e) {
      console.warn('Mic access denied — using fallback pulse reactivity');
      fallbackLoop();
    }
  }

  function getVolume() {
    if (!analyser || !dataArray) return 0;
    analyser.getByteFrequencyData(dataArray);
    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
    return sum / dataArray.length / 255; // 0..1
  }

  let smoothVol = 0;
  // ── State-aware animation ──────────────────────────────────────
  // States: 'idle' | 'thinking' | 'talking' | 'muted'
  let ariaState = 'idle';
  let thinkPulse = 0; // oscillator for thinking brightness

  function setAriaState(newState) {
    if (ariaState === newState) return;
    ariaState = newState;
  }

  function audioLoop() {
    const raw = getVolume();
    smoothVol = raw > smoothVol ? raw * 0.6 + smoothVol * 0.4 : raw * 0.15 + smoothVol * 0.85;
    applyReactivity(smoothVol);
    requestAnimationFrame(audioLoop);
  }

  // Fallback: pulse based on TTS state + token flow
  let fallbackEnergy = 0;
  function fallbackLoop() {
    const target = isSpeaking ? 0.4 : 0;
    fallbackEnergy += (target - fallbackEnergy) * 0.1;
    applyReactivity(fallbackEnergy);
    requestAnimationFrame(fallbackLoop);
  }

  function applyReactivity(vol) {
    thinkPulse += 0.06;

    let tx = 0, ty = 0, scale = 1, brightness = 1, hue = 0, glowOpacity = 0, glowColor1, glowColor2;

    switch (ariaState) {
      case 'thinking':
        // Drift upper-right, rapid brightness oscillation
        tx = 6; ty = -5;
        scale = 1.02 + Math.sin(thinkPulse) * 0.015;
        brightness = 1.1 + Math.sin(thinkPulse * 2.5) * 0.15;
        hue = Math.sin(thinkPulse * 0.7) * 12;
        glowOpacity = 0.18 + Math.sin(thinkPulse * 2) * 0.08;
        glowColor1 = `rgba(139,92,246,${glowOpacity * 0.5})`;  // purple thinking
        glowColor2 = `rgba(59,130,246,${glowOpacity * 0.3})`;   // blue accent
        break;

      case 'talking':
        // Drift toward bottom-left (near chat), voice-reactive
        tx = -4; ty = 3;
        scale = 1 + vol * 0.07;
        brightness = 1.05 + vol * 0.35;
        hue = vol * 10;
        glowOpacity = vol * 0.4;
        glowColor1 = `rgba(250,204,21,${vol * 0.14})`;   // golden warmth
        glowColor2 = `rgba(139,92,246,${vol * 0.07})`;    // purple mix
        break;

      case 'muted':
        // Dim, retreat to lower-right corner
        tx = 8; ty = 6;
        scale = 0.96;
        brightness = 0.5;
        hue = -5;
        glowOpacity = 0;
        glowColor1 = 'transparent';
        glowColor2 = 'transparent';
        break;

      default: // idle
        // Center, gentle breathing
        tx = Math.sin(thinkPulse * 0.3) * 1.2;
        ty = Math.cos(thinkPulse * 0.2) * 0.8;
        scale = 1 + Math.sin(thinkPulse * 0.5) * 0.008;
        brightness = 0.95 + Math.sin(thinkPulse * 0.4) * 0.05;
        hue = 0;
        glowOpacity = 0.03;
        glowColor1 = `rgba(250,204,21,0.03)`;
        glowColor2 = 'transparent';
        break;
    }

    animContainer.style.transform = `translate(${tx}%, ${ty}%) scale(${scale})`;
    animContainer.style.filter = `brightness(${brightness}) hue-rotate(${hue}deg)`;

    voiceGlow.style.opacity = glowOpacity;
    voiceGlow.style.background = `radial-gradient(ellipse at 50% 50%, ${glowColor1} 0%, ${glowColor2} 40%, transparent 70%)`;
  }

  // Init audio on first click (browser requires user gesture)
  document.addEventListener('click', () => initAudio(), { once: true });

  function connect() {
    ws = new WebSocket(WS_URL);
    ws.onopen = () => {
      dot.style.background = '#4ade80';
      connText.textContent = '';
      clearTimeout(reconnectTimer);
    };
    ws.onclose = () => {
      dot.style.background = '#f87171';
      connText.textContent = 'reconnecting…';
      streamEl = null;
      reconnectTimer = setTimeout(connect, 2000);
    };
    ws.onerror = () => ws.close();
    ws.onmessage = (e) => {
      try { dispatch(JSON.parse(e.data)); } catch {}
    };
  }

  function dispatch(msg) {
    switch (msg.kind) {
      case 'thinking':
        streamEl = addMsg('aria', '');
        streamEl.querySelector('.text').classList.add('cursor-blink');
        setAriaState('thinking');
        break;
      case 'token': {
        const t = msg.payload?.text || '';
        if (!streamEl) { streamEl = addMsg('aria', ''); }
        const span = streamEl.querySelector('.text');
        span.classList.add('cursor-blink');
        span.textContent += t;
        scrollChat();
        // Kick fallback energy on token flow
        if (!audioInitialized) fallbackEnergy = Math.min(fallbackEnergy + 0.08, 0.5);
        // Transition from thinking to talking once tokens flow
        if (ariaState === 'thinking') setAriaState('talking');
        break;
      }
      case 'response': {
        if (streamEl) {
          const span = streamEl.querySelector('.text');
          span.textContent = msg.payload?.text || '';
          span.classList.remove('cursor-blink');
          streamEl = null;
        } else if (msg.payload?.text) {
          addMsg('aria', msg.payload.text);
        }
        break;
      }
      case 'mic':
        if (msg.payload?.text) addMsg('user', msg.payload.text);
        break;
      case 'tts':
        isSpeaking = !!msg.payload?.speaking;
        if (isSpeaking) setAriaState('talking');
        break;
      case 'status':
        if (msg.payload?.paused !== undefined) {
          muted = msg.payload.paused;
          showMuteState();
          if (muted) { setAriaState('muted'); }
          else { setAriaState('idle'); }
        } else {
          // status kind without paused = state update (e.g. idle)
          if (!muted) setAriaState('idle');
        }
        break;
    }
  }

  function addMsg(role, text) {
    const div = document.createElement('div');
    div.className = 'msg';
    const color = role === 'aria' ? '#e2e8f0' : '#94a3b8';
    const prefix = role === 'aria' ? '' : '🎙 ';
    div.innerHTML = `<span style="font-family:monospace;font-size:13px;color:${color};background:rgba(0,0,0,0.4);padding:3px 10px;border-radius:8px;display:inline-block;max-width:80vw;backdrop-filter:blur(6px);line-height:1.5;"><span class="text">${prefix}${text}</span></span>`;
    chatLog.appendChild(div);
    // Keep max 30 messages
    while (chatLog.children.length > 30) chatLog.removeChild(chatLog.firstChild);
    scrollChat();
    return div;
  }

  function scrollChat() {
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function toggleMute() {
    if (!ws || ws.readyState !== 1) return;
    muted = !muted;
    ws.send(JSON.stringify({ kind: muted ? 'pause' : 'resume', ts: Date.now() }));
    showMuteState();
    setAriaState(muted ? 'muted' : 'idle');
  }

  function showMuteState() {
    muteLabel.textContent = muted ? '🔇 muted' : '🎙 listening';
    muteIndicator.style.opacity = '1';
    setTimeout(() => { muteIndicator.style.opacity = '0'; }, 1800);
  }

  // ── Webcam preview polling + dragging ─────────────────────────
  const wcPreview = document.getElementById('webcam-preview');
  const wcImg = document.getElementById('webcam-img');
  const wcStatus = document.getElementById('webcam-status');
  let wcHasFeed = false;

  async function pollWebcam() {
    try {
      const res = await fetch('http://localhost:8000/webcam/snapshot', { cache: 'no-store' });
      if (res.ok && res.headers.get('content-type')?.includes('image')) {
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        wcImg.onload = () => URL.revokeObjectURL(url);
        wcImg.src = url;
        if (!wcHasFeed) {
          wcHasFeed = true;
          wcPreview.classList.remove('no-feed');
          wcStatus.textContent = '● live';
          wcStatus.className = '';
          wcStatus.id = 'webcam-status';
        }
      } else {
        if (wcHasFeed) {
          wcHasFeed = false;
          wcPreview.classList.add('no-feed');
          wcStatus.textContent = 'no feed';
          wcStatus.className = 'off';
          wcStatus.id = 'webcam-status';
        }
      }
    } catch {
      if (wcHasFeed) {
        wcHasFeed = false;
        wcPreview.classList.add('no-feed');
        wcStatus.textContent = 'no feed';
        wcStatus.className = 'off';
        wcStatus.id = 'webcam-status';
      }
    }
  }
  setInterval(pollWebcam, 2000);
  pollWebcam();

  // Drag logic
  let dragging = false, dragOffX = 0, dragOffY = 0;
  wcPreview.addEventListener('mousedown', (e) => {
    dragging = true;
    dragOffX = e.clientX - wcPreview.getBoundingClientRect().left;
    dragOffY = e.clientY - wcPreview.getBoundingClientRect().top;
    e.preventDefault(); e.stopPropagation();
  });
  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    wcPreview.style.left = (e.clientX - dragOffX) + 'px';
    wcPreview.style.top = (e.clientY - dragOffY) + 'px';
    wcPreview.style.right = 'auto';
  });
  document.addEventListener('mouseup', () => { dragging = false; });
  // Prevent drag from triggering mute toggle
  wcPreview.addEventListener('click', (e) => { e.stopPropagation(); });

  connect();
  </script>

</body>
</html>
