<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARIA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="module">
  // Pre-load MediaPipe as a proper ES module (file:// can't dynamic-import cross-origin)
  try {
    const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs');
    window._mpVision = vision;
    console.log('[MediaPipe] Module pre-loaded');
  } catch (e) {
    console.warn('[MediaPipe] Module pre-load failed:', e);
    window._mpVision = null;
  }
</script>
<style>
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: 0.03;
    pointer-events: none;
    z-index: 9999;
    mix-blend-mode: overlay;
  }
  #chat-log { scrollbar-width: none; }
  #chat-log::-webkit-scrollbar { display: none; }
  .msg { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
  #mute-indicator { transition: opacity 0.3s; }
  .cursor-blink::after { content: '▊'; animation: pulse 0.8s infinite; color: #facc15; }
  /* Webcam preview */
  #webcam-preview {
    position: fixed; top: 16px; right: 16px; z-index: 200;
    width: 180px; min-width: 100px; max-width: 80vw;
    border-radius: 10px; overflow: hidden;
    border: 2px solid rgba(250,204,21,0.4);
    background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    cursor: grab; user-select: none;
    transition: opacity 0.4s, border-color 0.3s;
  }
  #webcam-preview:active { cursor: grabbing; }
  #webcam-preview.no-feed { opacity: 0.3; border-color: rgba(248,113,113,0.5); }
  #webcam-preview video { width: 100%; display: block; transform: scaleX(-1); }
  #webcam-preview canvas {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; transform: scaleX(-1);
  }
  /* Resize handle — bottom-right corner */
  #wc-resize {
    position: absolute; bottom: 0; right: 0; width: 18px; height: 18px;
    cursor: nwse-resize; z-index: 210;
    background: linear-gradient(135deg, transparent 50%, rgba(250,204,21,0.5) 50%);
    border-radius: 0 0 8px 0;
  }
  #wc-resize:hover { background: linear-gradient(135deg, transparent 40%, rgba(250,204,21,0.8) 40%); }
  #webcam-status {
    position: absolute; bottom: 0; left: 0; right: 0;
    font-family: monospace; font-size: 10px; text-align: center;
    padding: 2px 0; color: #4ade80; background: rgba(0,0,0,0.6);
  }
  #webcam-status.off { color: #f87171; }
  /* Static background — never moves, anchors perception */
  #static-bg {
    position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(ellipse at 50% 50%, #0a0a1a 0%, #050510 60%, #020208 100%);
  }
  #anim-container {
    position: fixed; z-index: 1;
    /* Oversize by 15% on each side so translate/scale never reveals bare edges */
    top: -8%; left: -8%; width: 116%; height: 116%;
    transition: filter 0.08s ease-out, transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    will-change: transform, filter;
  }
  #voice-glow {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, rgba(250,204,21,0.0) 0%, transparent 70%);
    transition: opacity 0.15s ease-out, background 0.8s ease;
    opacity: 0;
  }
</style>
</head>

<body class="m-0 w-screen h-screen overflow-hidden bg-[#050510]">

  <!-- Static background — anchors perception so transforms don't move the "screen" -->
  <div id="static-bg"></div>

  <!-- Fullscreen Animation Container (oversized so edges never show) -->
  <div id="anim-container">
    <div data-us-project="lmSXlfVhWVrbN3qzElFu" data-us-scale="1" data-us-dpi="1.5" data-us-fps="60" data-us-lazyload="true" data-us-production="true" role="img" aria-label="Animated 3D background" style="width:100%;height:100%;"></div>
  </div>

  <!-- Voice-reactive glow overlay -->
  <div id="voice-glow"></div>

  <!-- Mute indicator — top center -->
  <div id="mute-indicator" style="position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:100;opacity:0;pointer-events:none;">
    <span id="mute-label" style="font-family:monospace;font-size:14px;color:#facc15;background:rgba(0,0,0,0.5);padding:4px 14px;border-radius:20px;backdrop-filter:blur(8px);"></span>
  </div>

  <!-- Chat input bar — bottom -->
  <div id="chat-input-bar" style="position:fixed;bottom:12px;left:24px;right:180px;z-index:110;display:flex;align-items:center;gap:6px;">
    <label id="attach-btn" title="Attach file or image" style="cursor:pointer;font-size:18px;opacity:0.5;transition:opacity 0.2s;padding:4px;">📎
      <input type="file" id="file-input" accept="image/*,.txt,.md,.pdf,.json,.csv" multiple style="display:none;">
    </label>
    <input type="text" id="chat-input" placeholder="Type a message or paste a link…"
      style="flex:1;font-family:monospace;font-size:13px;color:#e2e8f0;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:8px 12px;outline:none;backdrop-filter:blur(8px);"
    >
    <button id="send-btn" title="Send" style="font-size:18px;background:none;border:none;cursor:pointer;opacity:0.5;transition:opacity 0.2s;padding:4px;">➤</button>
  </div>

  <!-- Chat overlay — above input -->
  <div id="chat-log" style="position:fixed;bottom:48px;left:24px;right:24px;max-height:35vh;overflow-y:auto;z-index:100;display:flex;flex-direction:column;gap:6px;"></div>

  <!-- Connection status badge — top left -->
  <div id="conn-dot" style="position:fixed;top:16px;left:16px;z-index:100;display:flex;align-items:center;gap:8px;pointer-events:none;">
    <span id="dot" style="width:10px;height:10px;border-radius:50%;background:#f87171;display:inline-block;box-shadow:0 0 6px #f87171;transition:background 0.3s,box-shadow 0.3s;"></span>
    <span id="conn-text" style="font-family:monospace;font-size:12px;color:#f87171;letter-spacing:0.5px;text-transform:uppercase;transition:color 0.3s;">offline</span>
  </div>

  <!-- Mic level + live transcription — bottom right -->
  <div id="mic-panel" style="position:fixed;bottom:24px;right:24px;z-index:100;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none;">
    <!-- Live transcription preview -->
    <div id="mic-transcript" style="font-family:monospace;font-size:12px;color:#94a3b8;background:rgba(0,0,0,0.5);padding:4px 12px;border-radius:8px;backdrop-filter:blur(8px);max-width:300px;text-align:right;opacity:0;transition:opacity 0.3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></div>
    <!-- Volume bar -->
    <div style="display:flex;align-items:center;gap:8px;">
      <span id="mic-icon" style="font-size:16px;opacity:0.5;transition:opacity 0.2s;">🎙</span>
      <div style="width:120px;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden;backdrop-filter:blur(4px);">
        <div id="mic-bar" style="height:100%;width:0%;background:linear-gradient(90deg,#4ade80,#facc15,#f87171);border-radius:3px;transition:width 0.05s ease-out;"></div>
      </div>
      <span id="mic-status-label" style="font-family:monospace;font-size:10px;color:#64748b;min-width:50px;">silent</span>
    </div>
  </div>

  <!-- Webcam preview — draggable + resizable, top right -->
  <div id="webcam-preview" class="no-feed">
    <video id="webcam-video" autoplay playsinline muted></video>
    <canvas id="webcam-canvas"></canvas>
    <div id="webcam-status" class="off">no feed</div>
    <div id="wc-resize"></div>
  </div>

  <!-- Unicorn Studio SDK -->
  <script>
  !function(){var u=window.UnicornStudio;if(u&&u.init){u.init()}else{var d=document,s=d.createElement("script");s.src="https://cdn.jsdelivr.net/gh/hiunicornstudio/unicornstudio.js@v2.1.3/dist/unicornStudio.umd.js";s.onload=function(){window.UnicornStudio&&window.UnicornStudio.init()};(d.head||d.body).appendChild(s)}}();
  </script>

  <script>
  const WS_URL = 'ws://localhost:8000/ws';
  let ws = null;
  let muted = false;
  let reconnectTimer = null;
  let isSpeaking = false;

  const chatLog = document.getElementById('chat-log');
  const muteIndicator = document.getElementById('mute-indicator');
  const muteLabel = document.getElementById('mute-label');
  const dot = document.getElementById('dot');
  const connText = document.getElementById('conn-text');
  const animContainer = document.getElementById('anim-container');
  const voiceGlow = document.getElementById('voice-glow');
  let streamEl = null;

  // ── Audio reactivity via browser mic ──────────────────────────
  let audioCtx = null, analyser = null, dataArray = null;
  let audioInitialized = false;

  async function initAudio() {
    if (audioInitialized) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      audioCtx = new AudioContext();
      const source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.8;
      source.connect(analyser);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      audioInitialized = true;
      audioLoop();
    } catch (e) {
      console.warn('Mic access denied — using fallback pulse reactivity');
      fallbackLoop();
    }
  }

  function getVolume() {
    if (!analyser || !dataArray) return 0;
    analyser.getByteFrequencyData(dataArray);
    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
    return sum / dataArray.length / 255; // 0..1
  }

  let smoothVol = 0;
  // ── State-aware animation ──────────────────────────────────────
  // States: 'idle' | 'thinking' | 'talking' | 'muted'
  let ariaState = 'idle';
  let thinkPulse = 0; // oscillator for thinking brightness

  function setAriaState(newState) {
    if (ariaState === newState) return;
    ariaState = newState;
  }

  const micBar = document.getElementById('mic-bar');
  const micIcon = document.getElementById('mic-icon');
  const micStatusLabel = document.getElementById('mic-status-label');

  function audioLoop() {
    const raw = getVolume();
    smoothVol = raw > smoothVol ? raw * 0.6 + smoothVol * 0.4 : raw * 0.15 + smoothVol * 0.85;

    // Drive mic level bar
    const barPct = Math.min(100, smoothVol * 250);
    micBar.style.width = barPct + '%';
    micIcon.style.opacity = smoothVol > 0.03 ? '1' : '0.4';
    micStatusLabel.textContent = smoothVol > 0.15 ? 'speaking' : smoothVol > 0.03 ? 'hearing' : 'silent';
    micStatusLabel.style.color = smoothVol > 0.15 ? '#4ade80' : smoothVol > 0.03 ? '#facc15' : '#64748b';

    applyReactivity(smoothVol);
    requestAnimationFrame(audioLoop);
  }

  // Fallback: pulse based on TTS state + token flow
  let fallbackEnergy = 0;
  function fallbackLoop() {
    const target = isSpeaking ? 0.4 : 0;
    fallbackEnergy += (target - fallbackEnergy) * 0.1;
    applyReactivity(fallbackEnergy);
    requestAnimationFrame(fallbackLoop);
  }

  function applyReactivity(vol) {
    thinkPulse += 0.06;

    let tx = 0, ty = 0, scale = 1, brightness = 1, hue = 0, glowOpacity = 0, glowColor1, glowColor2;

    switch (ariaState) {
      case 'thinking':
        // Drift upper-right, rapid brightness oscillation
        tx = 6; ty = -5;
        scale = 1.02 + Math.sin(thinkPulse) * 0.015;
        brightness = 1.1 + Math.sin(thinkPulse * 2.5) * 0.15;
        hue = Math.sin(thinkPulse * 0.7) * 12;
        glowOpacity = 0.18 + Math.sin(thinkPulse * 2) * 0.08;
        glowColor1 = `rgba(139,92,246,${glowOpacity * 0.5})`;  // purple thinking
        glowColor2 = `rgba(59,130,246,${glowOpacity * 0.3})`;   // blue accent
        break;

      case 'talking':
        // Drift toward bottom-left (near chat), voice-reactive
        tx = -4; ty = 3;
        scale = 1 + vol * 0.07;
        brightness = 1.05 + vol * 0.35;
        hue = vol * 10;
        glowOpacity = vol * 0.4;
        glowColor1 = `rgba(250,204,21,${vol * 0.14})`;   // golden warmth
        glowColor2 = `rgba(139,92,246,${vol * 0.07})`;    // purple mix
        break;

      case 'muted':
        // Dim, retreat to lower-right corner
        tx = 8; ty = 6;
        scale = 0.96;
        brightness = 0.5;
        hue = -5;
        glowOpacity = 0;
        glowColor1 = 'transparent';
        glowColor2 = 'transparent';
        break;

      default: // idle
        // Center, gentle breathing
        tx = Math.sin(thinkPulse * 0.3) * 1.2;
        ty = Math.cos(thinkPulse * 0.2) * 0.8;
        scale = 1 + Math.sin(thinkPulse * 0.5) * 0.008;
        brightness = 0.95 + Math.sin(thinkPulse * 0.4) * 0.05;
        hue = 0;
        glowOpacity = 0.03;
        glowColor1 = `rgba(250,204,21,0.03)`;
        glowColor2 = 'transparent';
        break;
    }

    animContainer.style.transform = `translate(${tx}%, ${ty}%) scale(${scale})`;
    animContainer.style.filter = `brightness(${brightness}) hue-rotate(${hue}deg)`;

    voiceGlow.style.opacity = glowOpacity;
    voiceGlow.style.background = `radial-gradient(ellipse at 50% 50%, ${glowColor1} 0%, ${glowColor2} 40%, transparent 70%)`;
  }

  // Init audio on first click (browser requires user gesture)
  document.addEventListener('click', () => initAudio(), { once: true });

  function connect() {
    ws = new WebSocket(WS_URL);
    ws.onopen = () => {
      dot.style.background = '#4ade80';
      dot.style.boxShadow = '0 0 8px #4ade80';
      connText.textContent = 'ARIA online';
      connText.style.color = '#4ade80';
      clearTimeout(reconnectTimer);
    };
    ws.onclose = () => {
      dot.style.background = '#f87171';
      dot.style.boxShadow = '0 0 6px #f87171';
      connText.textContent = 'offline';
      connText.style.color = '#f87171';
      streamEl = null;
      reconnectTimer = setTimeout(connect, 2000);
    };
    ws.onerror = () => ws.close();
    ws.onmessage = (e) => {
      try { dispatch(JSON.parse(e.data)); } catch {}
    };
  }

  function dispatch(msg) {
    switch (msg.kind) {
      case 'thinking':
        streamEl = addMsg('aria', '');
        streamEl.querySelector('.text').classList.add('cursor-blink');
        setAriaState('thinking');
        connText.textContent = 'ARIA thinking…';
        connText.style.color = '#facc15';
        dot.style.background = '#facc15';
        dot.style.boxShadow = '0 0 8px #facc15';
        break;
      case 'token': {
        const t = msg.payload?.text || '';
        if (!streamEl) { streamEl = addMsg('aria', ''); }
        const span = streamEl.querySelector('.text');
        span.classList.add('cursor-blink');
        span.textContent += t;
        scrollChat();
        // Kick fallback energy on token flow
        if (!audioInitialized) fallbackEnergy = Math.min(fallbackEnergy + 0.08, 0.5);
        // Transition from thinking to talking once tokens flow
        if (ariaState === 'thinking') setAriaState('talking');
        break;
      }
      case 'response': {
        if (streamEl) {
          const span = streamEl.querySelector('.text');
          span.textContent = msg.payload?.text || '';
          span.classList.remove('cursor-blink');
          streamEl = null;
        } else if (msg.payload?.text) {
          addMsg('aria', msg.payload.text);
        }
        // Restore online badge after response completes
        connText.textContent = 'ARIA online';
        connText.style.color = '#4ade80';
        dot.style.background = '#4ade80';
        dot.style.boxShadow = '0 0 8px #4ade80';
        break;
      }
      case 'mic':
        if (msg.payload?.text) {
          addMsg('user', msg.payload.text);
          // Flash transcription in mic panel
          const micTranscript = document.getElementById('mic-transcript');
          micTranscript.textContent = '🎙 ' + msg.payload.text;
          micTranscript.style.opacity = '1';
          micTranscript.style.color = '#4ade80';
          clearTimeout(window._micFadeTimer);
          window._micFadeTimer = setTimeout(() => {
            micTranscript.style.opacity = '0';
          }, 4000);
        }
        break;
      case 'tts':
        isSpeaking = !!msg.payload?.speaking;
        if (isSpeaking) {
          setAriaState('talking');
          connText.textContent = 'ARIA speaking';
          connText.style.color = '#38bdf8';
          dot.style.background = '#38bdf8';
          dot.style.boxShadow = '0 0 8px #38bdf8';
        } else {
          connText.textContent = 'ARIA online';
          connText.style.color = '#4ade80';
          dot.style.background = '#4ade80';
          dot.style.boxShadow = '0 0 8px #4ade80';
        }
        break;
      case 'mic_level': {
        // Server-side mic volume — drives the bar even if browser mic isn't available
        const vol = msg.payload?.volume || 0;
        const speech = msg.payload?.speech || false;
        const pct = Math.min(100, vol * 250);
        micBar.style.width = pct + '%';
        micIcon.style.opacity = speech ? '1' : '0.4';
        micStatusLabel.textContent = vol > 0.15 ? 'speaking' : speech ? 'hearing' : 'silent';
        micStatusLabel.style.color = vol > 0.15 ? '#4ade80' : speech ? '#facc15' : '#64748b';
        break;
      }
      case 'status':
        if (msg.payload?.paused !== undefined) {
          muted = msg.payload.paused;
          showMuteState();
          if (muted) {
            setAriaState('muted');
            connText.textContent = 'ARIA paused';
            connText.style.color = '#facc15';
            dot.style.background = '#facc15';
            dot.style.boxShadow = '0 0 6px #facc15';
          } else {
            setAriaState('idle');
            connText.textContent = 'ARIA online';
            connText.style.color = '#4ade80';
            dot.style.background = '#4ade80';
            dot.style.boxShadow = '0 0 8px #4ade80';
          }
        } else {
          if (!muted) setAriaState('idle');
        }
        break;
    }
  }

  function addMsg(role, text) {
    const div = document.createElement('div');
    div.className = 'msg';
    const color = role === 'aria' ? '#e2e8f0' : '#94a3b8';
    const prefix = role === 'aria' ? '' : '🎙 ';
    div.innerHTML = `<span style="font-family:monospace;font-size:13px;color:${color};background:rgba(0,0,0,0.4);padding:3px 10px;border-radius:8px;display:inline-block;max-width:80vw;backdrop-filter:blur(6px);line-height:1.5;user-select:text;cursor:text;"><span class="text">${prefix}${text}</span></span>`;
    chatLog.appendChild(div);
    // Keep max 30 messages
    while (chatLog.children.length > 30) chatLog.removeChild(chatLog.firstChild);
    scrollChat();
    return div;
  }

  function scrollChat() {
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function toggleMute() {
    if (!ws || ws.readyState !== 1) return;
    muted = !muted;
    ws.send(JSON.stringify({ kind: muted ? 'pause' : 'resume', ts: Date.now() }));
    showMuteState();
    setAriaState(muted ? 'muted' : 'idle');
  }

  function showMuteState() {
    muteLabel.textContent = muted ? '⏸ paused' : '▶ listening';
    muteIndicator.style.opacity = '1';
    setTimeout(() => { muteIndicator.style.opacity = '0'; }, 1800);
  }

  // ── Live webcam + MediaPipe face detection ──────────────────────
  const wcPreview = document.getElementById('webcam-preview');
  const wcVideo = document.getElementById('webcam-video');
  const wcCanvas = document.getElementById('webcam-canvas');
  const wcCtx = wcCanvas.getContext('2d');
  const wcStatus = document.getElementById('webcam-status');
  let wcHasFeed = false;
  let faceLandmarker = null;
  let lastFaceTime = 0;

  // Load MediaPipe Tasks Vision (pre-loaded as module in <head>)
  async function loadMediaPipe() {
    try {
      // Wait for module pre-load (up to 10s)
      for (let i = 0; i < 100 && window._mpVision === undefined; i++) {
        await new Promise(r => setTimeout(r, 100));
      }
      if (!window._mpVision) throw new Error('Module did not load');
      const { FaceLandmarker, FilesetResolver, DrawingUtils } = window._mpVision;
      const filesetResolver = await FilesetResolver.forVisionTasks(
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm'
      );
      faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
          delegate: 'GPU'
        },
        runningMode: 'VIDEO',
        numFaces: 1,
        outputFaceBlendshapes: true,
        outputFacialTransformationMatrixes: false
      });
      window._mpDrawingUtils = DrawingUtils;
      window._mpFaceLandmarker = FaceLandmarker;
      console.log('[MediaPipe] FaceLandmarker ready');
    } catch (e) {
      console.warn('[MediaPipe] Failed to load — face detection disabled:', e);
    }
  }
  loadMediaPipe();

  // Start live webcam stream
  async function startWebcam() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' },
        audio: false
      });
      wcVideo.srcObject = stream;
      wcVideo.addEventListener('loadeddata', () => {
        wcHasFeed = true;
        wcPreview.classList.remove('no-feed');
        wcStatus.textContent = '● live';
        wcStatus.className = '';
        wcStatus.id = 'webcam-status';
        wcCanvas.width = wcVideo.videoWidth;
        wcCanvas.height = wcVideo.videoHeight;
        detectLoop();
      });
    } catch (e) {
      console.warn('[Webcam] Access denied or unavailable:', e);
      wcStatus.textContent = 'no feed';
      wcStatus.className = 'off';
      wcStatus.id = 'webcam-status';
    }
  }
  startWebcam();

  // Hidden canvas for capturing low-res frames to send to Qwen3-VL
  const frameCanvas = document.createElement('canvas');
  frameCanvas.width = 160; frameCanvas.height = 120;
  const frameCtx = frameCanvas.getContext('2d');
  let lastFrameSend = 0;
  const FRAME_INTERVAL_MS = 5000; // send a frame every 5s (vision is expensive)

  function captureFrame() {
    if (!wcHasFeed || !wcVideo.videoWidth) return null;
    frameCtx.drawImage(wcVideo, 0, 0, 160, 120);
    // Return base64 JPEG without the data:image/jpeg;base64, prefix
    const dataUrl = frameCanvas.toDataURL('image/jpeg', 0.4);
    return dataUrl.split(',')[1]; // strip prefix, return raw base64
  }

  // Face detection loop — runs on every animation frame
  let lastDetectMs = 0;
  function detectLoop() {
    if (!wcHasFeed) return;
    const now = performance.now();
    // Clear canvas
    wcCtx.clearRect(0, 0, wcCanvas.width, wcCanvas.height);

    if (faceLandmarker && now - lastDetectMs > 66) { // ~15fps detection
      lastDetectMs = now;
      try {
        const results = faceLandmarker.detectForVideo(wcVideo, now);
        if (results.faceLandmarks && results.faceLandmarks.length > 0) {
          // Draw face mesh
          const landmarks = results.faceLandmarks[0];
          drawFaceMesh(landmarks);

          // Update status
          lastFaceTime = Date.now();

          // Send blendshapes to server if available
          if (results.faceBlendshapes && results.faceBlendshapes.length > 0 && ws && ws.readyState === 1) {
            const shapes = results.faceBlendshapes[0].categories;
            // Extract key expressions
            const expr = {};
            for (const s of shapes) {
              if (['browInnerUp', 'eyeSquintLeft', 'eyeSquintRight', 'jawOpen',
                   'mouthSmileLeft', 'mouthSmileRight', 'mouthFrownLeft', 'mouthFrownRight',
                   'eyeBlinkLeft', 'eyeBlinkRight'].includes(s.categoryName)) {
                expr[s.categoryName] = Math.round(s.score * 100) / 100;
              }
            }
            // Derive mood for status display
            const smile = ((expr.mouthSmileLeft||0) + (expr.mouthSmileRight||0)) / 2;
            const frown = ((expr.mouthFrownLeft||0) + (expr.mouthFrownRight||0)) / 2;
            const brow = expr.browInnerUp || 0;
            const jaw = expr.jawOpen || 0;
            const blink = ((expr.eyeBlinkLeft||0) + (expr.eyeBlinkRight||0)) / 2;
            let mood = 'neutral';
            if (smile > 0.4) mood = 'smile ' + Math.round(smile*100) + '%';
            else if (frown > 0.3) mood = 'frown';
            else if (brow > 0.4) mood = 'surprised';
            else if (jaw > 0.5) mood = 'talking';
            else if (blink > 0.5) mood = 'blink';
            wcStatus.textContent = '● face · ' + mood;

            // Throttle expressions: send at most every 500ms
            if (now - (window._lastExprSend || 0) > 500) {
              window._lastExprSend = now;
              // Capture a frame every FRAME_INTERVAL_MS for native vision
              let frame = null;
              if (now - lastFrameSend > FRAME_INTERVAL_MS) {
                frame = captureFrame();
                if (frame) lastFrameSend = now;
              }
              ws.send(JSON.stringify({ kind: 'vision', payload: { face: true, expressions: expr, frame } }));
            }
          } else {
            wcStatus.textContent = '● face detected';
          }
        } else {
          // No face
          if (Date.now() - lastFaceTime > 3000 && wcHasFeed) {
            wcStatus.textContent = '● live (no face)';
          }
        }
      } catch (e) { /* detection error, skip frame */ }
    }
    requestAnimationFrame(detectLoop);
  }

  // Draw minimal face mesh overlay
  function drawFaceMesh(landmarks) {
    wcCtx.save();
    // Draw dots at key landmark positions
    wcCtx.fillStyle = 'rgba(250, 204, 21, 0.4)';
    // Face oval indices (simplified)
    const keyPoints = [10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288,
                       397, 365, 379, 378, 400, 377, 152, 148, 176, 149, 150, 136,
                       172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109];
    for (const idx of keyPoints) {
      if (landmarks[idx]) {
        const x = landmarks[idx].x * wcCanvas.width;
        const y = landmarks[idx].y * wcCanvas.height;
        wcCtx.beginPath();
        wcCtx.arc(x, y, 1.5, 0, 2 * Math.PI);
        wcCtx.fill();
      }
    }
    // Eye outlines
    wcCtx.strokeStyle = 'rgba(74, 222, 128, 0.5)';
    wcCtx.lineWidth = 1;
    const leftEye = [33, 7, 163, 144, 145, 153, 154, 155, 133, 173, 157, 158, 159, 160, 161, 246];
    const rightEye = [362, 382, 381, 380, 374, 373, 390, 249, 263, 466, 388, 387, 386, 385, 384, 398];
    for (const eye of [leftEye, rightEye]) {
      wcCtx.beginPath();
      for (let i = 0; i < eye.length; i++) {
        const pt = landmarks[eye[i]];
        if (!pt) continue;
        const x = pt.x * wcCanvas.width, y = pt.y * wcCanvas.height;
        i === 0 ? wcCtx.moveTo(x, y) : wcCtx.lineTo(x, y);
      }
      wcCtx.closePath();
      wcCtx.stroke();
    }
    wcCtx.restore();
  }

  // Drag logic (move from body, resize from handle)
  let dragging = false, resizing = false, dragOffX = 0, dragOffY = 0, resizeStartW = 0, resizeStartX = 0;
  const wcResize = document.getElementById('wc-resize');

  // Resize handle
  wcResize.addEventListener('mousedown', (e) => {
    resizing = true;
    resizeStartW = wcPreview.getBoundingClientRect().width;
    resizeStartX = e.clientX;
    e.preventDefault(); e.stopPropagation();
  });

  // Move handle (anywhere except resize corner)
  wcPreview.addEventListener('mousedown', (e) => {
    if (resizing) return;
    dragging = true;
    dragOffX = e.clientX - wcPreview.getBoundingClientRect().left;
    dragOffY = e.clientY - wcPreview.getBoundingClientRect().top;
    e.preventDefault(); e.stopPropagation();
  });

  document.addEventListener('mousemove', (e) => {
    if (resizing) {
      const newW = Math.max(100, Math.min(window.innerWidth * 0.8, resizeStartW + (e.clientX - resizeStartX)));
      wcPreview.style.width = newW + 'px';
    } else if (dragging) {
      wcPreview.style.left = (e.clientX - dragOffX) + 'px';
      wcPreview.style.top = (e.clientY - dragOffY) + 'px';
      wcPreview.style.right = 'auto';
    }
  });
  document.addEventListener('mouseup', () => { dragging = false; resizing = false; });
  // Prevent drag/resize from triggering mute toggle
  wcPreview.addEventListener('click', (e) => { e.stopPropagation(); });

  // Spacebar toggles pause/resume (only when not typing in input)
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !e.repeat && document.activeElement !== chatInput) {
      e.preventDefault();
      toggleMute();
    }
  });

  // ── Chat input: send text ──
  const chatInput = document.getElementById('chat-input');
  const sendBtn = document.getElementById('send-btn');
  const attachBtn = document.getElementById('attach-btn');
  const fileInput = document.getElementById('file-input');

  function sendText() {
    const text = chatInput.value.trim();
    if (!text || !ws || ws.readyState !== 1) return;
    ws.send(JSON.stringify({ kind: 'command', payload: { text, speaker: 'Neokode' } }));
    addMsg('user', text);
    chatInput.value = '';
  }

  sendBtn.addEventListener('click', (e) => { e.stopPropagation(); sendText(); });
  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
  });

  // Hover effects
  sendBtn.addEventListener('mouseenter', () => sendBtn.style.opacity = '1');
  sendBtn.addEventListener('mouseleave', () => sendBtn.style.opacity = '0.5');
  attachBtn.addEventListener('mouseenter', () => attachBtn.style.opacity = '1');
  attachBtn.addEventListener('mouseleave', () => attachBtn.style.opacity = '0.5');

  // ── File/image upload ──
  fileInput.addEventListener('change', async (e) => {
    const files = e.target.files;
    if (!files.length) return;
    for (const file of files) {
      if (file.type.startsWith('image/')) {
        // Upload image to server
        const form = new FormData();
        form.append('file', file);
        try {
          const resp = await fetch('/knowledge/upload', { method: 'POST', body: form });
          const data = await resp.json();
          if (data.ok) {
            addMsg('user', `📎 Uploaded image: ${file.name}`);
            ws.send(JSON.stringify({ kind: 'command', payload: { text: `I just uploaded an image called "${file.name}". Acknowledge it.`, speaker: 'Neokode' } }));
          }
        } catch (err) { addMsg('user', `❌ Upload failed: ${err.message}`); }
      } else {
        // Text-based files — read and send as message
        const text = await file.text();
        const preview = text.slice(0, 2000);
        ws.send(JSON.stringify({ kind: 'command', payload: { text: `Here is the content of ${file.name}:\n\n${preview}`, speaker: 'Neokode' } }));
        addMsg('user', `📎 Sent file: ${file.name} (${text.length} chars)`);
      }
    }
    fileInput.value = '';  // reset
  });

  connect();
  </script>
